<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vectrum Driver Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
</head>
<body>
<style>
/* Layout: phone frame with the clickable app on the left, demo controls + change notes for ClickUp on the right. Single dark look, matching the app. */
:root{
  color-scheme:dark;
  --page:#0a0d16; --bg:#05070d; --surface:#111522; --surface2:#191e2e; --line:#242a3c;
  --fg:#f4f6fb; --muted:#8b91a3; --dim:#5d6377;
  --accent:#5d6ef5; --accent-soft:rgba(93,110,245,.16); --accent-line:rgba(93,110,245,.45);
  --ok:#4cd17a; --ok-soft:rgba(76,209,122,.14);
  --warn:#f2b544; --warn-soft:rgba(242,181,68,.14);
  --bad:#ef5a5a; --bad-soft:rgba(239,90,90,.15);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--page);color:var(--fg);font-family:var(--font);-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,label:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{display:flex;gap:32px;justify-content:center;align-items:flex-start;flex-wrap:wrap;max-width:1100px;margin:0 auto}

/* ---------- phone ---------- */
.phone{width:390px;max-width:100%;height:844px;border-radius:52px;background:var(--bg);position:relative;overflow:hidden;
  box-shadow:0 0 0 10px #1b1f2b,0 0 0 11px #2b3040,0 30px 80px rgba(0,0,0,.6);flex:none;margin:11px}
@media (max-width:520px){.phone{height:min(844px,calc(100svh - 48px));border-radius:36px;margin:6px;box-shadow:0 0 0 6px #1b1f2b}}
.statusbar{position:absolute;inset:0 0 auto;height:50px;display:flex;align-items:center;justify-content:space-between;padding:6px 34px 0 44px;font-weight:600;font-size:16px;z-index:5;pointer-events:none}
.statusbar .ic{display:flex;gap:6px;align-items:center}
.content{position:absolute;inset:0;overflow-y:auto;padding:60px 16px 130px;scrollbar-width:none}
.content::-webkit-scrollbar{display:none}
.content.noTab{padding-bottom:120px}
.content.full{padding-bottom:24px}

h1.big{font-size:34px;font-weight:800;letter-spacing:-.5px;margin:18px 4px 18px}
.topbar{display:flex;align-items:center;justify-content:center;position:relative;height:52px;margin-bottom:10px}
.topbar h2{font-size:17px;font-weight:700;margin:0}
.topbar .right{position:absolute;right:0}
.topbar .left{position:absolute;left:0}
.roundbtn{width:46px;height:46px;border-radius:50%;background:var(--surface2);border:1px solid var(--line);display:grid;place-items:center;color:var(--accent)}
.roundbtn.plain{color:var(--fg)}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13px;color:var(--muted);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.dot.off{background:var(--dim)}
.dot.warn{background:var(--warn)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px}
.stack{display:flex;flex-direction:column;gap:14px}
.sect{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:6px 4px 0;display:flex;align-items:center;gap:6px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.xs{font-size:12px}
.b{font-weight:700}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.divider{height:1px;background:var(--line);margin:12px 0}

.avatar{width:48px;height:48px;border-radius:50%;background:linear-gradient(145deg,#26305e,#1a1f3a);display:grid;place-items:center;font-weight:800;font-size:16px;position:relative;flex:none;border:1px solid #2d3561}
.avatar.lg{width:76px;height:76px;font-size:26px}
.avatar.xl{width:112px;height:112px;font-size:38px}
.avatar .st{position:absolute;right:0;bottom:0;width:13px;height:13px;border-radius:50%;background:var(--ok);border:2.5px solid var(--surface)}
.avatar .st.off{background:var(--dim)}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:16px;font-weight:700;font-size:16px;width:100%}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary[disabled]{opacity:.4;cursor:default}
.btn.ghost{background:var(--surface2);border:1px solid var(--line)}
.btn.danger{background:var(--bad);color:#fff}
.btn.ok{background:var(--ok);color:#06210f}
.btn.outline{border:1px solid var(--accent-line);color:var(--accent);background:var(--accent-soft)}
.btn.sm{height:42px;font-size:14px;border-radius:13px}
.btnrow{display:flex;gap:10px}

.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip.dim{background:var(--surface2);color:var(--muted)}

/* tab bar */
.tabbar{position:absolute;left:14px;right:14px;bottom:22px;height:72px;border-radius:36px;background:rgba(36,40,54,.92);backdrop-filter:blur(14px);border:1px solid #343a4e;display:grid;grid-template-columns:repeat(4,1fr);padding:6px;z-index:6}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;border-radius:30px;color:#e8eaf2;position:relative}
.tab.on{background:#0e1220;color:var(--accent)}
.tab .badge{position:absolute;top:6px;right:calc(50% - 22px);min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 5px}

/* list rows */
.listrow{display:flex;align-items:center;gap:12px;padding:12px 4px;width:100%}
.listrow + .listrow{border-top:1px solid var(--line)}
.pinned{background:linear-gradient(180deg,rgba(93,110,245,.10),rgba(93,110,245,.03));border:1px solid var(--accent-line);border-radius:20px;padding:14px}

/* toggle */
.tgl{width:62px;height:36px;border-radius:18px;background:#3a3f50;position:relative;flex:none}
.tgl::after{content:"";position:absolute;top:3px;left:3px;width:30px;height:30px;border-radius:50%;background:#fff;transition:left .2s}
.tgl.on{background:var(--accent)}
.tgl.on::after{left:29px}

/* flow */
.flowhead{display:flex;align-items:center;justify-content:space-between;height:52px}
.flowhead h2{font-size:17px;margin:0}
.progress{display:flex;gap:6px;margin:6px 2px 20px}
.progress i{flex:1;height:4px;border-radius:2px;background:var(--surface2)}
.progress i.on{background:var(--accent)}
.q{font-size:26px;font-weight:800;letter-spacing:-.3px;margin:0 2px 6px;text-wrap:balance}
.qsub{color:var(--muted);margin:0 2px 20px;font-size:15px;line-height:1.4}
.option{display:flex;align-items:center;gap:14px;width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:16px;text-align:left}
.option.sel{border-color:var(--accent);background:var(--accent-soft)}
.option .oi{width:52px;height:52px;border-radius:15px;background:var(--surface2);display:grid;place-items:center;color:var(--accent);flex:none}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;aspect-ratio:1/1.02;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;font-size:13px;font-weight:600;text-align:center;padding:8px;max-width:100%}
.tile svg{color:var(--accent)}
.tile.sel{border-color:var(--accent);background:var(--accent-soft)}
.sev{display:flex;gap:14px;align-items:flex-start;width:100%;border-radius:20px;padding:16px;border:1.5px solid var(--line);background:var(--surface);text-align:left}
.sev .sw{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none}
.bottomcta{position:absolute;left:0;right:0;bottom:0;padding:14px 16px 30px;background:linear-gradient(180deg,rgba(5,7,13,0),var(--bg) 30%);z-index:4;display:flex;flex-direction:column;gap:10px}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ph{aspect-ratio:1;border-radius:16px;overflow:hidden;position:relative;background:var(--surface2);max-width:100%}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .x{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.65);display:grid;place-items:center}
.addph{aspect-ratio:1;border-radius:16px;border:1.5px dashed var(--accent-line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--accent);font-size:12px;font-weight:700;background:var(--accent-soft);cursor:pointer;max-width:100%}
textarea{width:100%;min-height:92px;resize:none;background:var(--surface);border:1px solid var(--line);border-radius:16px;color:var(--fg);font:inherit;font-size:15px;padding:14px}
textarea::placeholder,input::placeholder{color:var(--dim)}
.meta{display:grid;grid-template-columns:auto 1fr;gap:9px 12px;font-size:14px;align-items:center}
.meta svg{color:var(--muted)}
.voice{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px;width:100%}
.voice .mic{width:40px;height:40px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.voice.rec .mic{background:var(--bad);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(239,90,90,.18)}}
.wave{display:flex;gap:3px;align-items:center;height:22px}
.wave i{width:3px;border-radius:2px;background:var(--accent)}

/* timeline */
.tl{display:flex;flex-direction:column}
.tl .st{display:flex;gap:12px;position:relative;padding-bottom:16px}
.tl .st:last-child{padding-bottom:0}
.tl .st::before{content:"";position:absolute;left:11px;top:24px;bottom:0;width:2px;background:var(--line)}
.tl .st:last-child::before{display:none}
.tl .st.done::before{background:var(--accent)}
.tl .bul{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);background:var(--bg);flex:none;display:grid;place-items:center;z-index:1}
.tl .done .bul{background:var(--accent);border-color:var(--accent)}
.tl .cur .bul{border-color:var(--accent)}
.tl .cur .bul::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}

/* chat */
.msgs{display:flex;flex-direction:column;gap:8px}
.bub{max-width:80%;padding:10px 13px;border-radius:18px;font-size:15px;line-height:1.35}
.bub.them{background:var(--surface2);align-self:flex-start;border-bottom-left-radius:6px}
.bub.me{background:var(--accent);align-self:flex-end;border-bottom-right-radius:6px;color:#fff}
.bub .t{display:block;font-size:11px;opacity:.6;margin-top:3px;text-align:right}
.repcard{align-self:flex-end;width:82%;background:var(--surface);border:1px solid var(--accent-line);border-radius:18px;padding:12px;text-align:left}
.sysline{align-self:center;font-size:12px;color:var(--muted);padding:4px 0}
.composer{position:absolute;left:0;right:0;bottom:0;padding:10px 12px 28px;background:var(--bg);border-top:1px solid var(--line);z-index:4;display:flex;flex-direction:column;gap:8px}
.composer .in{display:flex;gap:8px;align-items:center}
.composer input{flex:1;min-width:0;height:44px;border-radius:22px;background:var(--surface2);border:1px solid var(--line);color:var(--fg);padding:0 16px;font:inherit;font-size:15px}
.qchips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.qchip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;display:flex;gap:6px;align-items:center}

/* search */
.search{height:50px;border-radius:25px;background:var(--surface2);display:flex;align-items:center;gap:10px;padding:0 18px;color:var(--muted);margin-bottom:14px}

/* call */
.callscr{position:absolute;inset:0;background:radial-gradient(120% 70% at 50% 20%,#1e2552 0%,#090b16 65%);display:flex;flex-direction:column;align-items:center;padding:120px 24px 60px;z-index:8}
.callbtns{margin-top:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:28px;width:100%;max-width:300px;justify-items:center}
.cb{width:68px;height:68px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center}
.cb.on{background:#fff;color:#0a0d16}
.cb.end{background:var(--bad)}
.cbl{font-size:12px;color:var(--muted);margin-top:8px;text-align:center}

/* sheet & toast */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:9;display:flex;align-items:flex-end}
.sheet{width:100%;background:var(--surface);border-radius:28px 28px 0 0;padding:22px 18px 34px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.toast{position:absolute;top:56px;left:14px;right:14px;z-index:10;background:#232942;border:1px solid var(--accent-line);border-radius:18px;padding:12px 14px;display:flex;gap:10px;align-items:center;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:drop .3s ease}
@keyframes drop{from{transform:translateY(-14px);opacity:0}}
.offbar{background:var(--warn-soft);color:var(--warn);border-radius:14px;padding:10px 12px;font-size:13px;font-weight:600;display:flex;gap:8px;align-items:center;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stats .k{font-size:13px;color:var(--muted)}
.stats .v{font-size:16px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.links{display:flex;flex-direction:column;align-items:center;gap:22px;padding:18px 0 8px;color:var(--accent);font-size:16px}
.links .del{color:var(--bad)}
.stop{display:flex;gap:12px}
.stop .pt{width:14px;display:flex;flex-direction:column;align-items:center}
.stop .pt i{width:12px;height:12px;border-radius:50%;border:2px solid var(--accent);background:var(--bg)}
.stop .pt i.done{background:var(--accent)}
.stop .pt b{flex:1;width:2px;background:var(--line);margin:3px 0}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.qa button{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;font-weight:600;text-align:center}
.qa .ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.qa .ico.w{background:var(--warn-soft);color:var(--warn)}

/* ---------- side panel ---------- */
.panel{flex:1;min-width:0;max-width:440px;display:flex;flex-direction:column;gap:18px;padding-top:10px}
.panel h1{font-size:24px;margin:0;letter-spacing:-.3px}
.panel p{margin:0;color:var(--muted);line-height:1.5;font-size:14px}
.pbox{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.pbox h3{margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ctl{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px}
.seg{display:flex;background:var(--surface2);border-radius:10px;padding:3px}
.seg button{padding:6px 10px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--accent);color:#fff}
.scen{display:flex;flex-direction:column;gap:6px}
.scen button{background:var(--surface2);border-radius:12px;padding:10px 12px;font-size:14px;display:flex;justify-content:space-between;gap:10px}
.notes{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px;font-size:14px;line-height:1.45}
.notes li::marker{color:var(--accent)}
.notes b{color:var(--fg)}
.where{font-size:13px;color:var(--accent);font-weight:700}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <div class="phone" id="phone"></div>
  <aside class="panel" id="panel"></aside>
</div>
<input type="file" id="photoInput" accept="image/*" capture="environment" multiple hidden>

<script>

 snow:'<path d="M12 2v20M4.9 4.9l14.2 14.2M2 12h20M4.9 19.1L19.1 4.9"/>',

function demoPhoto(i){
  const c=document.createElement('canvas');c.width=c.height=360;const x=c.getContext('2d');
  const hues=[[38,32,28],[26,30,40],[40,36,30]][i%3];
  const g=x.createLinearGradient(0,0,360,360);g.addColorStop(0,`rgb(${hues[0]*2.4},${hues[1]*2.4},${hues[2]*2.4})`);g.addColorStop(1,'#0b0c10');
  x.fillStyle=g;x.fillRect(0,0,360,360);
  x.fillStyle='#16171b';x.beginPath();x.arc(180+(i%2?30:-20),190,130,0,7);x.fill();
  x.strokeStyle='#2a2c33';x.lineWidth=14;for(let k=0;k<26;k++){const a=k/26*Math.PI*2;x.beginPath();x.moveTo(180+(i%2?30:-20)+Math.cos(a)*100,190+Math.sin(a)*100);x.lineTo(180+(i%2?30:-20)+Math.cos(a)*126,190+Math.sin(a)*126);x.stroke();}
  x.fillStyle='#5c5f68';x.beginPath();x.arc(180+(i%2?30:-20),190,58,0,7);x.fill();
  x.fillStyle='#3b3e46';x.beginPath();x.arc(180+(i%2?30:-20),190,22,0,7);x.fill();
  x.strokeStyle='#e9b04a';x.lineWidth=4;x.beginPath();x.moveTo(90,120);x.lineTo(130,150);x.lineTo(118,175);x.lineTo(150,205);x.stroke();
  x.fillStyle='rgba(0,0,0,.55)';x.fillRect(0,322,360,38);x.fillStyle='#fff';x.font='600 17px sans-serif';x.fillText('WE 7102T · '+now()+' · A2 km 341',12,347);
  return c.toDataURL('image/jpeg',.8);
}

 <h3 class="q">${title}</h3>${body}${cta?`<div class="bottomcta">${cta}</div>`:''}`;
}

let lastKey='';
function render(){
 const ph=document.getElementById('phone');
 const old=ph.querySelector('.content');const st=old?old.scrollTop:0;
 const t=topV(); let body='',cls='',showTab=!t;
 if(!t){body={routes:routesView,chat:chatView,calls:callsView,profile:profileView}[S.tab]();}
 else{const [v,a]=t.split(':');cls='noTab';
  body={ 'r-unit':rUnit,'r-cat':rCat,'r-sev':rSev,'r-det':rDet,'r-rev':rRev,
   'r-done':()=>rDone(+a),'detail':()=>rDetail(+a),'thread':()=>threadView(a),'moving':movingView}[v]();
  if(v==='thread')cls='full';
 }
 const key=(t||S.tab);
 ph.innerHTML=statusBar()+`<div class="content ${cls}">${!S.online&&!t?`<div style="height:0"></div>`:''}${body}</div>`+(showTab?tabbar():'')+(S.call?callView():'')+sheet()+(S.toast?`<div class="toast">${S.toast}</div>`:'');
 const c=ph.querySelector('.content');
 if(key===lastKey)c.scrollTop=st; else if(key.startsWith('thread'))c.scrollTop=c.scrollHeight;
 lastKey=key;
 renderPanel();
}
function sheet(){
 if(S.sheet==='discard')return `<div class="scrim" data-act="closesheet"><div class="sheet" data-stop="1"><div class="b" style="font-size:19px">Discard this report?</div><div class="small muted" style="margin-bottom:8px">Photos and notes you added will be deleted.</div><button class="btn danger" data-act="dodiscard">Discard</button><button class="btn ghost" data-act="closesheet">Keep editing</button></div></div>`;
 if(S.sheet==='gsm'){const c=contact();return `<div class="scrim" data-act="closesheet"><div class="sheet" data-stop="1"><div class="b" style="font-size:19px">Call ${c.name} by phone?</div><div class="small muted" style="margin-bottom:8px">Uses your mobile network, works without internet. Number: <span style="user-select:all;color:var(--fg)">${c.phone}</span></div><button class="btn ok" data-act="startcall:gsm">${ic('phone',18)} Call ${c.phone}</button><button class="btn ghost" data-act="closesheet">Cancel</button></div></div>`;}
 return '';
}
let toastT;
function toast(html,ms=3200){S.toast=html;render();clearTimeout(toastT);toastT=setTimeout(()=>{S.toast=null;render()},ms)}

/* ---------------- actions ---------------- */
function push(v){S.stack.push(v);render()}
function startReport(){S.draft={unit:null,cat:null,catKey:null,sev:null,photos:[],note:'',voice:0};S.recording=false;push(S.moving?'moving':'r-unit')}
let recTimer,callTimer;
function stopRec(){clearInterval(recTimer);S.recording=false;S.draft.voice=Math.max(2,S.recSec)}
function sendReport(){
 const d=S.draft;if(S.recording)stopRec();
 const id=S.nextId++;const t=now();
 const r={id,unit:d.unit,cat:d.cat,sev:d.sev,photos:d.photos.slice(),note:d.note,voice:d.voice,date:'Today',time:t,status:S.online?'sent':'queued',to:contact().id,log:{queued:S.online?null:'Today '+t,sent:S.online?'Today '+t:null}};
 S.reports.unshift(r);S.msgs[r.to].push({type:'report',id,time:t});
 S.draft=null;S.stack=['r-done:'+id];render();
 if(r.status==='sent')scheduleSeen(r);
}
function scheduleSeen(r){setTimeout(()=>{if(r.status!=='sent')return;r.status='seen';r.log.seen='Today '+now();toast(`${ic('check',18)}<span><b>${contact().name.split(' ')[0]}</b> viewed report #${r.id}</span>`)},3500)}
function advance(id){const r=S.reports.find(x=>x.id===id);const c=r.to==='olena'?LOGIST:DUTY;const t=now();
 if(r.status==='sent'){r.status='seen';r.log.seen='Today '+t}
 else if(r.status==='seen'){r.status='work';r.log.work='Today '+t;
  const txt=r.sev==='high'?'Got it. Roadside assistance is on the way, ETA 40 min. Stay safe, I’ll call you in 10 min.':'Seen it. Please stop at MAN Service Konin, exit 241. They’re expecting you.';
  S.msgs[r.to].push({from:'them',text:txt,time:t});
  if(!(topV()||'').startsWith('thread'))S.unreadChat++;
  toast(`<span class="avatar" style="width:32px;height:32px;font-size:12px">${c.ini}</span><span><b>${c.name}</b>: ${txt.slice(0,48)}…</span>`,4000);return;}
 else if(r.status==='work'){r.status='resolved';r.log.resolved='Today '+t;S.msgs[r.to].push({from:'them',text:`Report #${r.id} is resolved. Thanks for the photos!`,time:t})}
 render();
}
function setOnline(v){S.online=v;
 if(v){const q=S.reports.filter(r=>r.status==='queued');q.forEach(r=>{r.status='sent';r.log.sent='Today '+now();scheduleSeen(r)});
  if(q.length){toast(`${ic('check',18)}<span>Back online. Report #${q.map(r=>r.id).join(', #')} sent.</span>`);return;}}
 render();
}
function startCall(target){const c=target==='olena'?LOGIST:target==='marek'?DUTY:contact();
 S.sheet=null;S.call={c,gsm:target==='gsm',sec:0,mute:false};render();
 clearInterval(callTimer);let ring=0;
 callTimer=setInterval(()=>{const el=document.getElementById('callT');ring++;if(ring<3)return;S.call.sec++;if(el)el.textContent='0'+Math.floor(S.call.sec/60)+':'+String(S.call.sec%60).padStart(2,'0')},800);
}
function endCall(){clearInterval(callTimer);const k=S.call;const s=k.sec;S.calls.unshift({name:k.c.name,dur:s?`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`:'No answer',missed:!s,time:now()});S.call=null;render()}

document.addEventListener('click',e=>{
 const stopEl=e.target.closest('[data-stop]');const el=e.target.closest('[data-act]');
 if(!el)return; if(stopEl&&el.dataset.act==='closesheet'&&el.classList.contains('scrim'))return;
 const [a,...rest]=el.dataset.act.split(':');const arg=rest.join(':');
 const d=S.draft;
 switch(a){
  case 'tab':S.tab=arg;S.stack=[];if(arg==='chat')S.unreadChat=S.unreadChat;render();break;
  case 'report':startReport();break;
  case 'stopped':S.moving=false;S.stack.pop();push('r-unit');break;
  case 'unit':d.unit=arg;if(d.catKey&&!CATS[arg].some(x=>x[0]===d.catKey)){d.catKey=null;d.cat=null}push('r-cat');break;
  case 'cat':d.catKey=arg;d.cat=CATS[d.unit].find(x=>x[0]===arg)[1];push('r-sev');break;
  case 'sev':d.sev=arg;push('r-det');break;
  case 'demoph':d.photos.push(demoPhoto(d.photos.length));render();break;
  case 'rmph':d.photos.splice(+arg,1);render();break;
  case 'voice':if(S.recording){stopRec();render()}else{S.recording=true;S.recSec=0;render();recTimer=setInterval(()=>{S.recSec++;const t=document.getElementById('recT');if(t)t.textContent='0:'+String(S.recSec).padStart(2,'0');if(S.recSec>=60){stopRec();render()}},1000)}break;
  case 'rmvoice':d.voice=0;render();break;
  case 'toreview':if(S.recording)stopRec();push('r-rev');break;
  case 'jump':{const i=S.stack.indexOf(arg);if(i>=0){S.stack=S.stack.slice(0,i+1);render()}break;}
  case 'send':sendReport();break;
  case 'back':if(S.recording)stopRec();S.stack.pop();render();break;
  case 'discard':S.sheet='discard';render();break;
  case 'dodiscard':if(S.recording)stopRec();S.sheet=null;S.draft=null;S.stack=[];render();break;
  case 'closesheet':S.sheet=null;render();break;
  case 'home':S.stack=[];render();break;
  case 'detail':push('detail:'+arg);break;
  case 'advance':advance(+arg);break;
  case 'thread':{const id=arg||contact().id;if(id===contact().id)S.unreadChat=0;
    if((topV()||'').startsWith('r-done'))S.stack=[];push('thread:'+id);break;}
  case 'quick':case 'sendmsg':{const inp=document.getElementById('msgIn');const txt=a==='quick'?arg:inp.value.trim();if(!txt)return;
    const tid=(topV()||'').split(':')[1]||contact().id;S.msgs[tid].push({from:'me',text:txt,time:now()});render();break;}
  case 'startcall':startCall(arg);break;
  case 'gsm':S.sheet='gsm';render();break;
  case 'endcall':endCall();break;
  case 'mute':S.call.mute=!S.call.mute;render();break;
  // panel
  case 'net':setOnline(arg==='on');break;
  case 'shift':S.onShift=arg==='on';render();break;
  case 'move':S.moving=arg==='on';render();break;
  case 'scen':runScen(arg);break;
 }
});
document.addEventListener('input',e=>{if(e.target.dataset.in==='note'&&S.draft)S.draft.note=e.target.value});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='msgIn'){const b=document.querySelector('[data-act^="sendmsg"]');b&&b.click()}
 if(e.key==='Enter'&&e.target.classList.contains('addph'))document.getElementById('photoInput').click()});
document.getElementById('photoInput').addEventListener('change',e=>{
 const files=[...e.target.files].slice(0,6-(S.draft?S.draft.photos.length:0));
 Promise.all(files.map(f=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f)}))).then(list=>{if(S.draft){S.draft.photos.push(...list);render()}});
 e.target.value='';
});

function renderPanel(){
 const t=topV();const k=t?t.split(':')[0]:S.tab;
 const seg=(act,on,a,b)=>`<div class="seg"><button class="${on?'on':''}" data-act="${act}:on">${a}</button><button class="${!on?'on':''}" data-act="${act}:off">${b}</button></div>`;
 document.getElementById('panel').innerHTML=`
 <div><h1>Vectrum Driver · прототип</h1><p style="margin-top:6px">Кликабельный прототип: заявка о неисправности из карточки ТС и закреплённый контакт логиста в Чате и Звонках. Интерфейс на английском, как в приложении.</p></div>
 <div class="pbox"><h3>Условия демо</h3>
  <div class="ctl"><span>Сеть</span>${seg('net',S.online,'Онлайн','Нет сети')}</div>
  <div class="ctl"><span>Логист</span>${seg('shift',S.onShift,'На смене','Ночь')}</div>
  <div class="ctl"><span>Скорость</span>${seg('move',S.moving,'72 км/ч','Стоит')}</div>
 </div>
 <div class="pbox"><h3>Сценарии</h3><div class="scen">
  <button data-act="scen:full"><span>Полный флоу заявки (шины, с фото)</span>${ic('chev',16)}</button>
  <button data-act="scen:crit"><span>Критичная поломка ночью</span>${ic('chev',16)}</button>
  <button data-act="scen:offline"><span>Заявка без сети → автоотправка</span>${ic('chev',16)}</button>
  <button data-act="scen:moving"><span>Попытка заполнить на ходу</span>${ic('chev',16)}</button>
  <button data-act="scen:chat"><span>Pinned логист в Чате</span>${ic('chev',16)}</button>
  <button data-act="scen:calls"><span>Pinned логист в Звонках</span>${ic('chev',16)}</button>
 </div></div>
 <div class="pbox"><h3>Что на этом экране</h3><div class="where">${({profile:'Profile',routes:'Routes',chat:'Chat',calls:'Calls','r-unit':'Report · Unit','r-cat':'Report · Issue','r-sev':'Report · Severity','r-det':'Report · Details','r-rev':'Report · Review','r-done':'Report · Sent',detail:'Report details',thread:'Chat thread',moving:'Driving lock'})[k]}</div>
  <ul class="notes">${(NOTES[k]||[]).map(n=>`<li>${n}</li>`).join('')}</ul></div>`;
}
function runScen(s){
 S.call=null;S.sheet=null;S.stack=[];clearInterval(callTimer);
 if(s==='full'){S.online=true;S.onShift=true;S.moving=false;S.tab='profile';render();return;}
 if(s==='crit'){S.online=true;S.onShift=false;S.moving=false;S.tab='routes';startReport();S.draft.unit='trailer';S.draft.catKey='brakes';S.draft.cat='Brakes';S.draft.sev='high';S.draft.photos=[demoPhoto(1)];S.draft.note='Air leak on trailer brakes, pressure dropping. Stopped on the shoulder.';S.stack=['r-unit','r-cat','r-sev','r-det','r-rev'];render();return;}
 if(s==='offline'){S.online=false;S.moving=false;S.tab='profile';startReport();S.draft.unit='tractor';S.draft.catKey='lights';S.draft.cat='Lights';S.draft.sev='low';S.draft.photos=[demoPhoto(2)];S.stack=['r-unit','r-cat','r-sev','r-det','r-rev'];render();toast(`${ic('info',18)}<span>Отправьте заявку, затем включите «Онлайн» на панели справа.</span>`,4500);return;}
 if(s==='moving'){S.moving=true;S.tab='routes';render();toast(`${ic('info',18)}<span>Нажмите «Report issue».</span>`);return;}
 if(s==='chat'){S.tab='chat';render();return;}
 if(s==='calls'){S.tab='calls';render();return;}
}
render();
</script>
